
<!-- Table 'zigbeedevices' edit -->
<form action="?" method="post" enctype="multipart/form-data" name="frmEdit" class="form-horizontal">
[#if OK#]
<div class="alert alert-success"><#LANG_DATA_SAVED#></div>
[#endif OK#]
[#if ERR#]
<div class="alert alert-danger"><#LANG_FILLOUT_REQURED#></div>
[#endif ERR#]
<fieldset>
[#if ID=""#]
<legend><#LANG_NEW_RECORD#></legend>
[#endif ID#]
 <div class="form-group[#if ERR_DESCRIPTION#] has-error[#endif#]">
  <label for="description" class="col-lg-3 control-label">
   <#LANG_DESCRIPTION#>:
  </label>
  <div class="col-lg-9"><input id="description" name="description" value="[#DESCRIPTION#]" type="text" class="form-control"></div>
 </div>
<!-- TITLE (varchar) -->
<div class="form-group[#if ERR_TITLE#] has-error[#endif#]">
 <label for="title" class="col-lg-3 control-label">
 <#LANG_TITLE#>:
 </label>
 <div class="col-lg-9"><input id="title" name="title" value="[#TITLE#]" type="text" readonly class="form-control"></div>
</div>
<!-- IEEEADDR (varchar) -->
<div class="form-group[#if ERR_IEEEADDR#] has-error[#endif#]">
 <label for="ieeeaddr" class="col-lg-3 control-label">
 IEEEADDR:
 </label>
 <div class="col-lg-9"><input id="ieeeaddr" name="ieeeaddr" value="[#IEEEADDR#]" readonly type="text" class="form-control"></div>
</div>

 <div class="form-group">
  <label for="model_name" class="col-lg-3 control-label">
   <#LANG_ZIGBEEDEV_MODEL_NAME#>:
  </label>
  <div class="col-lg-9"><input id="model_name" value="[#MODEL_NAME#]" readonly type="text" class="form-control"></div>
 </div>

 <div class="form-group">
  <label for="model_id" class="col-lg-3 control-label">
   <#LANG_ZIGBEEDEV_MODEL_ID#>:
  </label>
  <div class="col-lg-9"><input id="model_id" value="[#MODEL#]" readonly type="text" class="form-control"></div>
 </div>

 <div class="form-group">
  <label for="model_description" class="col-lg-3 control-label">
   <#LANG_ZIGBEEDEV_MODEL_DESCRIPTION#>:
  </label>
  <div class="col-lg-9"><input id="model_description" value="[#MODEL_DESCRIPTION#]" readonly type="text" class="form-control"></div>
 </div>

 <div class="form-group">
  <label for="manufacturer_id" class="col-lg-3 control-label">
   <#LANG_ZIGBEEDEV_MANUFACTURER#>:
  </label>
  <div class="col-lg-9"><input id="manufacturer_id" value="[#MANUFACTURER_ID#]" readonly type="text" class="form-control"></div>
 </div>

 <div class="form-group">
  <label for="vendor" class="col-lg-3 control-label">
   <#LANG_ZIGBEEDEV_VENDOR#>:
  </label>
  <div class="col-lg-9"><input id="vendor" value="[#VENDOR#]" readonly type="text" class="form-control"></div>
 </div>

 <div class="form-group">
  <label for="full_path" class="col-lg-3 control-label">
   <#LANG_ZIGBEEDEV_TOPIC#>:
  </label>
  <div class="col-lg-9"><input id="full_path" name="full_path" value="[#FULL_PATH#]" readonly type="text" class="form-control"></div>
 </div>


<div class="form-group">
        <div class="col-lg-offset-3 col-lg-4">
 [#if ID!=""#]
 <button type="submit" name="subm" value="Submit" class="btn btn-primary"><#LANG_SUBMIT#></button>
 [#else ID#]
 <button type="submit" name="subm" value="Add" class="btn btn-primary"><#LANG_ADD#></button>
 [#endif ID#]
 <a href="?data_source=<#DATA_SOURCE#>" class="btn btn-default "><#LANG_CANCEL#></a>
<input type="hidden" name="id" value="<#ID#>">
<input type="hidden" name="view_mode" value="<#VIEW_MODE#>">
<input type="hidden" name="edit_mode" value="<#EDIT_MODE#>">
<input type="hidden" name="mode" value="update">
<input type="hidden" name="data_source" value="<#DATA_SOURCE#>">
<input type="hidden" name="tab" value="<#TAB#>">
        </div>
</div>
</fieldset>
</form>
